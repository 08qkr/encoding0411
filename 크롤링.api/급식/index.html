<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자운고등학교 급식 캘린더</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-title">
                <h1>🍽️ 자운고등학교 급식</h1>
                <p>맛있고 건강한 하루 식단</p>
            </div>
            <div class="month-nav">
                <button id="prev-month" class="nav-btn" aria-label="이전 달">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <h2 id="current-month-display">2026년 5월</h2>
                <button id="next-month" class="nav-btn" aria-label="다음 달">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>
        </header>

        <main class="calendar-wrapper">
            <div class="loading-overlay" id="loading">
                <div class="spinner"></div>
                <p>급식 정보를 불러오는 중...</p>
            </div>
            <div class="weekdays">
                <div>일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div>토</div>
            </div>
            <div class="calendar-grid" id="calendar-grid">
                <!-- Days will be generated by JS -->
            </div>
        </main>
    </div>

    <!-- Modal for Meal Details -->
    <div class="modal-backdrop" id="meal-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-date">2026년 5월 1일 (금)</h3>
                <button class="close-btn" id="close-modal" aria-label="닫기">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="meal-section">
                    <h4>🍱 식단 메뉴</h4>
                    <p id="modal-menu" class="menu-list"></p>
                </div>
                <div class="meal-section">
                    <h4>⚡ 칼로리</h4>
                    <p id="modal-cal" class="cal-info"></p>
                </div>
                <div class="meal-section">
                    <h4>📊 영양 성분</h4>
                    <p id="modal-nutrition" class="nutrition-list"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
